name: CI

# GitHub Actions only reads workflows from .github/workflows/ at the
# repository root, so this file lives here rather than inside either
# sub-project.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: pylint (PEP 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            multisignal-alpha/multisignal-alpha/requirements.txt
            real-data/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r multisignal-alpha/multisignal-alpha/requirements.txt
          # real-data's own imports, minus openassetpricing and wrds.
          # Those two are heavy or licensed, and .pylintrc lists them
          # under ignored-modules.
          pip install python-dotenv pandas-datareader
          pip install pylint

      - name: pylint -- research agent
        working-directory: multisignal-alpha/multisignal-alpha
        run: pylint --rcfile=../../.pylintrc src scripts tests

      - name: pylint -- real-data ingest
        working-directory: real-data
        run: pylint --rcfile=../.pylintrc src scripts

  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No .env file may be tracked
        run: |
          tracked=$(git ls-files -- '*.env' '.env' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::A .env file is committed. Remove it from git and"
            echo "::error::rotate every credential it contained."
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env files."

      - name: The committed execution config must hold no credentials
        run: |
          python - <<'EOF'
          import sys
          import yaml

          path = "multisignal-alpha/multisignal-alpha/configs/execution_config.yaml"
          with open(path, encoding="utf-8") as fh:
              cfg = yaml.safe_load(fh) or {}
          bad = []
          for section, key in (("broker", "api_key"),
                               ("broker", "secret_key"),
                               ("webhook", "passphrase")):
              value = (cfg.get(section) or {}).get(key, "")
              if value:
                  bad.append(f"{section}.{key}")
          if bad:
              print(f"::error::{path} sets {', '.join(bad)}.")
              print("::error::This file is committed. A value here is a "
                    "published credential, and a non-empty passphrase also "
                    "silences the listener's no-passphrase warning. Leave "
                    "them empty and use environment variables or .env.")
              sys.exit(1)
          print("execution_config.yaml carries no credentials.")
          EOF

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            multisignal-alpha/multisignal-alpha/requirements-dev.txt

      - name: Install dependencies
        working-directory: multisignal-alpha/multisignal-alpha
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Statistical-correctness suite
        working-directory: multisignal-alpha/multisignal-alpha
        run: python -m pytest -q --cov=src --cov-report=term-missing
