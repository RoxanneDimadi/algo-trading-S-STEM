# GENERATED by real-data/scripts/build_factor_panel.py -- edit
# configs/config.yaml for shared settings and regenerate this file.
# Cross-section at generation time: 5 factors -> n_quantiles=3
# !! SMOKE-TEST CONFIG: fewer than 25 factors. Statistical
# !! thresholds are relaxed to the structural minimum; treat the
# !! output as a plumbing check only. For the real run, set
# !! osap.portfolio_signals: all in real-data and rebuild.
run:
  seed: 42
  output_dir: results_factor
data:
  mode: panel_csv
  panel_csv:
    panel: data/raw/factor_panel.csv
    meta: data/raw/factor_meta.csv
    french_factors_csv: data/raw/french_factors.csv
evaluation:
  n_quantiles: 3
  nw_lags: 6
  rolling_ic_window: 24
  cost_bps_per_side: 10
  min_names_per_date: 3
walkforward:
  min_train: 120
  test_size: 12
  purge: 1
  embargo: 0
  expanding: true
models:
  linear:
    kind: elasticnet
    alpha: 0.0001
    l1_ratio: 0.5
  icnet:
    hidden: 16
    l2: 0.0001
    lr: 0.01
    max_epochs: 300
    patience: 25
    val_fraction: 0.15
  pulse:
    interactions: false
    a_grid:
    - 0.97
    - 0.99
    - 1.0
    q_scale_grid:
    - 0.002
    - 0.01
    - 0.05
    ridge: 1.0e-06
    obs_margin: 0
  lgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 100
    subsample: 0.8
    colsample_bytree: 0.8
    tune: false
    tune_trials: 25
agent:
  enabled: true
  epochs: 150
  lr: 0.05
  seed: 0
deflated_sharpe:
  count_single_signal_trials: true
