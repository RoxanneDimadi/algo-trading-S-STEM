# Paper/live Alpaca + webhook listener.
#
# This file is COMMITTED, so never put a credential in it. There are
# deliberately no api_key or secret_key entries below: the only place the
# server reads those from is the environment, which means .env beside this
# package or a variable exported in your shell. Adding them back here would
# publish them, and CI fails the build if they reappear with a value.
#
#   ALPACA_API_KEY, ALPACA_SECRET_KEY, WEBHOOK_PASSPHRASE

broker:
  provider: alpaca
  paper: true
  base_url: null
  timeout_seconds: 10.0
  max_retries: 2
  retry_delay_seconds: 0.5

webhook:
  host: "0.0.0.0"
  port: 8000
  # Deliberately empty. A placeholder here would be a real, working
  # passphrase published in the repository, and it would suppress the
  # "no passphrase" warning the listener logs at startup. Set
  # WEBHOOK_PASSPHRASE instead.
  passphrase: ""
  debug: false

agent_policy:
  gamma_speed: 0.35          # GP partial adjustment; lower = slower turnover
  cost_bps: 10.0
  impact_bps: 2.0
  alpha_hurdle_bps: 5.0      # skip trades with thinner net edge
  max_position_pct: 0.20
  max_order_notional: 50000.0
  min_trade_notional: 50.0
  allow_short: false
  default_base_alpha_bps: 30.0

ledger:
  db_path: "data/ledger.db"
  jsonl_path: "data/audit_log.jsonl"
